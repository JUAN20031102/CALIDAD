name: Pipeline de Calidad

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Construir frontend
        working-directory: frontend
        run: npm run build

      - name: Levantar backend
        working-directory: backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PORT: 5000
          FRONTEND_URL: http://127.0.0.1:3000
        run: npm start > backend.log 2>&1 &

      - name: Esperar que cargue el backend
        run: |
          for i in {1..40}; do
            if curl -s http://127.0.0.1:5000 > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            echo "Esperando backend..."
            sleep 2
          done
          echo "El backend no inicio a tiempo"
          exit 1

      - name: Levantar frontend
        working-directory: frontend
        run: npm run dev -- --host 127.0.0.1 --port 3000 > vite.log 2>&1 &

      - name: Esperar que cargue el frontend
        run: |
          for i in {1..40}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "Frontend listo"
              exit 0
            fi
            echo "Esperando frontend..."
            sleep 2
          done
          echo "El frontend no inicio a tiempo"
          exit 1

      - name: Crear carpeta de reportes
        run: mkdir -p reports

      - name: Ejecutar pruebas Selenium y generar reporte
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:3000
        run: |
          npm run test:selenium 2>&1 | tee ../reports/reporte-selenium.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Subir reporte de Selenium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-selenium
          path: reports/reporte-selenium.txt
          retention-days: 7